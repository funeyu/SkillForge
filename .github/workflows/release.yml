name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check release version and architecture
        run: |
          test "$(uname -m)" = arm64
          test "$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run prepare:speech
      - run: npm run dist:mac
      - name: Verify standalone speech runtime
        run: |
          printf '{"event":"finish"}\n' | dist/speech/skillforge-speech/skillforge-speech --model models/speech/base | tee dist/speech-check.jsonl
          grep -q '"event": "ready"' dist/speech-check.jsonl
          grep -q '"event": "done"' dist/speech-check.jsonl
      - name: Create checksums
        working-directory: dist/release
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "SkillForge $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/release/*.dmg dist/release/*.zip dist/release/SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
