name: Release

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0
      - name: Select unpublished release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(node -p 'require("./package.json").version')"
          fi
          if ! git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "No release tag for $tag; skipping."
            exit 0
          fi
          if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)" == false ]]; then
            echo "Release $tag is already published; skipping."
            exit 0
          fi
          git checkout --detach "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        if: steps.release.outputs.publish == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        if: steps.release.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - name: Check release version and architecture
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          test "$(uname -m)" = arm64
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
      - run: npm ci
        if: steps.release.outputs.publish == 'true'
      - run: npm run prepare:speech
        if: steps.release.outputs.publish == 'true'
      - run: npm run dist:mac
        if: steps.release.outputs.publish == 'true'
      - name: Verify standalone speech runtime
        if: steps.release.outputs.publish == 'true'
        run: |
          printf '{"event":"finish"}\n' | dist/speech/skillforge-speech/skillforge-speech --model models/speech/base | tee dist/speech-check.jsonl
          grep -q '"event": "ready"' dist/speech-check.jsonl
          grep -q '"event": "done"' dist/speech-check.jsonl
      - name: Create checksums
        if: steps.release.outputs.publish == 'true'
        working-directory: dist/release
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "SkillForge $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/release/*.dmg dist/release/*.zip dist/release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
